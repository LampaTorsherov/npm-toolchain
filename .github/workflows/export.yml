name: Export public Bun dependencies
on:
  workflow_dispatch:
    inputs:
      bun-version:
        description: Pinned Bun version
        required: true
        default: '1.3.3'
        type: string
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Build transfer archive
        run: bun scripts/export.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bun-registry-export
          path: dist/bun-registry-export.tar.gz
          retention-days: 1
          if-no-files-found: error
