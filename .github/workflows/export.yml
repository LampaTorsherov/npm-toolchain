name: Export public Bun dependencies
on:
  workflow_dispatch:
    inputs:
      bun-version:
        description: Bun version
        required: true
        default: '1.3.2'
        type: string
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ inputs.bun-version }}
      - name: Build bundle
        run: bash scripts/export.sh
      - uses: actions/upload-artifact@v4
        with:
          name: bun-registry-export
          path: bun-registry-export.tar.gz
          retention-days: 1
