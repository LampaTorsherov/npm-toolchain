name: Export npm packages (scratch image)

on:
  workflow_dispatch:
    inputs:
      include_transitive_dev_deps:
        description: 'Include devDependencies of every transitive package (can be HUGE)'
        required: true
        type: boolean
        default: false
      max_packages:
        description: 'Safety limit: maximum unique name@version entries'
        required: true
        type: number
        default: 15000

permissions:
  contents: read
  packages: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      INCLUDE_TRANSITIVE_DEV_DEPS: ${{ inputs.include_transitive_dev_deps && 'true' || 'false' }}
      MAX_PACKAGES: ${{ inputs.max_packages }}
      NPM_REGISTRY: https://registry.npmjs.org
      # Maximum estimated uncompressed layer size. Lower to 512 if needed.
      LAYER_TARGET_MIB: '768'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install exporter's semver parser (not part of transfer)
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json || printf '{"name":"npm-exporter","private":true,"type":"module"}\n' > package.json
          bun add --ignore-scripts --exact semver@7.7.3

      - name: Build transfer archive
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/export.mjs
          test -s dist/bun-registry-export.tar.gz
          du -h dist/bun-registry-export.tar.gz

      # The existing tar.gz is unpacked BEFORE creating Docker layers.
      # Every file, including every package .tgz, remains whole.
      # The internal archive directory layout is preserved at /export/.
      - name: Prepare size-bounded image layers
        id: prepare
        shell: bash
        env:
          ARCHIVE: ${{ github.workspace }}/dist/bun-registry-export.tar.gz
          WORK_DIR: ${{ runner.temp }}/npm-export-image
        run: |
          set -euo pipefail

          mkdir -p "$WORK_DIR/unpacked" "$WORK_DIR/context"
          tar -xzf "$ARCHIVE" -C "$WORK_DIR/unpacked" --no-same-owner

          python3 - <<'PY'
          import os
          import shutil
          import stat
          from pathlib import Path

          root = Path(os.environ['WORK_DIR'])
          source = root / 'unpacked'
          context = root / 'context'
          limit = int(os.environ['LAYER_TARGET_MIB']) * 1024 * 1024
          if limit <= 0:
              raise SystemExit('LAYER_TARGET_MIB must be positive')

          # Never split a file: .tgz packages and scripts are atomic.
          # Add headroom for tar headers, directory entries and file metadata.
          entries = []
          empty_dirs = []
          for dirpath, dirnames, filenames in os.walk(source, followlinks=False):
              current = Path(dirpath)
              for dirname in sorted(dirnames):
                  p = current / dirname
                  if p.is_symlink():
                      entries.append((p.relative_to(source), p, 4096, 'link'))
              dirnames[:] = sorted(d for d in dirnames if not (current / d).is_symlink())
              if not dirnames and not filenames:
                  empty_dirs.append(current.relative_to(source))
              for filename in sorted(filenames):
                  p = current / filename
                  rel = p.relative_to(source)
                  info = p.lstat()
                  if stat.S_ISREG(info.st_mode):
                      estimated = info.st_size + 4096
                      entries.append((rel, p, estimated, 'file'))
                  elif stat.S_ISLNK(info.st_mode):
                      entries.append((rel, p, 4096, 'link'))
                  else:
                      raise SystemExit(f'Unsupported archive member type: {rel}')

          if not entries:
              raise SystemExit('Export archive has no files')

          # Largest-first packing produces fewer layers without splitting files.
          entries.sort(key=lambda item: (-item[2], item[0].as_posix()))
          bins = []  # (estimated bytes, entries)
          for rel, src, size, kind in entries:
              if size > limit:
                  raise SystemExit(
                      f'Cannot fit one intact file into a {limit // (1024 * 1024)} MiB layer: '
                      f'{rel} ({src.lstat().st_size} bytes). '
                      'Reduce the export size or increase LAYER_TARGET_MIB.'
                  )
              for index, (used, items) in enumerate(bins):
                  if used + size <= limit:
                      items.append((rel, src, kind))
                      bins[index] = (used + size, items)
                      break
              else:
                  bins.append((size, [(rel, src, kind)]))

          # Include empty directories without needing an extra layer.
          if empty_dirs:
              if not bins:
                  bins.append((0, []))
              for rel in empty_dirs:
                  dest = context / 'part-0001' / rel
                  dest.mkdir(parents=True, exist_ok=True)

          dockerfile = ['FROM scratch']
          for index, (used, items) in enumerate(bins, start=1):
              part_name = f'part-{index:04d}'
              part_root = context / part_name
              part_root.mkdir(parents=True, exist_ok=True)
              for rel, src, kind in items:
                  dst = part_root / rel
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  if kind == 'link':
                      os.symlink(os.readlink(src), dst)
                  else:
                      try:
                          os.link(src, dst)  # No extra disk usage on the same filesystem.
                      except OSError:
                          shutil.copy2(src, dst)
              dockerfile.append(f'COPY {part_name}/ /export/')
              print(f'{part_name}: {len(items)} entries, estimated {used / (1024 * 1024):.1f} MiB')

          (context / 'Dockerfile').write_text('\n'.join(dockerfile) + '\n', encoding='utf-8')
          print(f'Total files/links: {len(entries)}; Docker data layers: {len(bins)}')
          PY

          echo "context=$WORK_DIR/context" >> "$GITHUB_OUTPUT"
          echo "layers=$(grep -c '^COPY ' "$WORK_DIR/context/Dockerfile")" >> "$GITHUB_OUTPUT"
          cat "$WORK_DIR/context/Dockerfile"

      - name: Build and publish scratch image to GHCR
        id: publish
        shell: bash
        env:
          CONTEXT: ${{ steps.prepare.outputs.context }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REPO="${GITHUB_REPOSITORY,,}"
          IMAGE="ghcr.io/${REPO}:npm-export-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

          docker build \
            --platform linux/amd64 \
            --file "$CONTEXT/Dockerfile" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "$IMAGE" \
            "$CONTEXT"

          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Print extraction instructions
        shell: bash
        env:
          IMAGE: ${{ steps.publish.outputs.image }}
          LAYERS: ${{ steps.prepare.outputs.layers }}
        run: |
          {
            echo '### npm transfer image'
            echo "Image: \`$IMAGE\`"
            echo "Data layers: $LAYERS"
            echo ''
            echo 'The ORIGINAL archive contents are available under `/export/`.'
            echo 'All `.tgz` packages are copied as whole files.'
            echo ''
            echo '```bash'
            echo "docker pull '$IMAGE'"
            echo "CID=\$(docker create '$IMAGE' /bin/true)"
            echo 'mkdir -p ./npm-export'
            echo 'docker cp "$CID:/export/." ./npm-export/'
            echo 'docker rm "$CID"'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
